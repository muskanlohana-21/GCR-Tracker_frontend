<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCR Tracker - Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans antialiased">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-[#0B132B] text-white flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center space-x-3 px-6 py-6 border-b border-gray-800">
                    <div class="bg-blue-600 p-2 rounded-lg text-white"><i class="fa-solid fa-graduation-cap text-xl"></i></div>
                    <span class="text-xl font-bold tracking-wide">GCR Tracker</span>
                </div>
                <nav class="mt-6 px-4 space-y-2">
                    <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800/50 rounded-xl transition">
                        <i class="fa-solid fa-house"></i><span>Dashboard</span>
                    </a>
                    <a href="assignments.html" class="flex items-center space-x-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800/50 rounded-xl transition">
                        <i class="fa-solid fa-book-open"></i><span>Assignments</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800/50 rounded-xl transition">
                        <i class="fa-regular fa-calendar"></i><span>Calendar</span>
                    </a>
                    <a href="notifications.html" class="flex items-center space-x-3 px-4 py-3 bg-blue-600 text-white rounded-xl font-medium shadow-lg relative">
                        <i class="fa-regular fa-bell"></i><span>Notifications</span>
                    </a>
                    <a href="classroom.html" class="flex items-center space-x-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800/50 rounded-xl transition">
                        <i class="fa-solid fa-chalkboard"></i><span>Google Classroom</span>
                    </a>
                    <a href="settings.html" class="flex items-center space-x-3 px-4 py-3 text-gray-400 hover:text-white hover:bg-gray-800/50 rounded-xl transition">
                        <i class="fa-solid fa-gear"></i><span>Settings</span>
                    </a>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-800">
                <a href="index.html" class="flex items-center space-x-3 px-4 py-3 text-gray-400 hover:text-red-400 transition">
                    <i class="fa-solid fa-right-from-bracket"></i><span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-4 ml-auto">
                    <div class="w-9 h-9 bg-blue-600 text-white font-semibold rounded-full flex items-center justify-center">M</div>
                    <span class="font-semibold text-gray-800 text-sm">Muskan</span>
                </div>
            </header>
            <main class="p-8 max-w-4xl space-y-6">
                <h1 class="text-2xl font-bold text-gray-900">Notifications</h1>
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-6">
                    <div class="flex items-start justify-between pb-5 border-b border-gray-100">
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center font-bold">A</div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">New assignment added</h4>
                                <p class="text-xs text-gray-500 mt-0.5">PF Lab Assignment 04</p>
                                <span class="text-[11px] text-gray-400 mt-1 block">2 hours ago</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-start justify-between pb-5 border-b border-gray-100">
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center font-bold">D</div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">Deadline approaching</h4>
                                <p class="text-xs text-gray-500 mt-0.5">English Lab Presentation</p>
                                <span class="text-[11px] text-gray-400 mt-1 block">5 hours ago</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-start justify-between">
                        <div class="flex items-start space-x-4">
                            <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center font-bold">B</div>
                            <div>
                                <h4 class="font-semibold text-gray-800 text-sm">Assignment updated</h4>
                                <p class="text-xs text-gray-500 mt-0.5">ICT Project</p>
                                <span class="text-[11px] text-gray-400 mt-1 block">1 day ago</span>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
